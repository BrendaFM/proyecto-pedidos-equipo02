<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de marcas</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        max-width: 600px;
        margin: 30px auto;
        padding: 20px;
      }

      h1 {
        color: #2455a4;
      }

      form {
        background-color: white;
        padding: 20px;
        border-radius: 8px;
      }

      label {
        font-weight: bold;
      }

      input,
      textarea,
      select {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #aaaaaa;
        border-radius: 4px;
        font: inherit;
      }

      textarea {
        resize: vertical;
      }

      button {
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
      }

      button[type="submit"] {
        background-color: #2455a4;
        color: white;
      }

      button[type="reset"] {
        background-color: #dddddd;
        color: #222222;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background-color: white;
      }

      th,
      td {
        border: 1px solid #cccccc;
        padding: 10px;
        text-align: left;
        overflow-wrap: anywhere;
      }

      th {
        background-color: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <h1>Registro de marcas</h1>
    <p>Formulario para registrar nuevas marcas.</p>
    <p>
      <button type="submit">Guardar marca</button>
      <button type="reset">Limpiar</button>
    </p>
    <form id="formMarca">
      <p>
        <label for="nombre">Nombre de la marca:</label><br />
        <input
          type="text"
          id="nombre"
          name="nombre"
          placeholder="Ejemplo: Samsung"
          required
        />
      </p>

      <p>
        <label for="descripcion">Descripción:</label><br />
        <textarea
          id="descripcion"
          name="descripcion"
          rows="3"
          placeholder="Escribe una breve descripción"
        ></textarea>
      </p>

      <p>
        <label for="estado">Estado:</label><br />
        <select id="estado" name="estado">
          <option value="Activa">Activa</option>
          <option value="Inactiva">Inactiva</option>
        </select>
      </p>
    </form>
    <h2>Marcas registradas</h2>

    <table>
      <thead>
        <tr>
          <th scope="col">N.º</th>
          <th scope="col">Nombre</th>
          <th scope="col">Descripción</th>
          <th scope="col">Estado</th>
        </tr>
      </thead>
      <tbody id="listaMarcas"></tbody>
    </table>
    <script>
      const formulario = document.getElementById("formMarca");
      const listaMarcas = document.getElementById("listaMarcas");
      let numeroMarca = 1;

      formulario.addEventListener("submit", function (evento) {
        evento.preventDefault();

        const campoNombre = document.getElementById("nombre");
        const nombre = campoNombre.value.trim();
        const descripcion = document.getElementById("descripcion").value.trim();
        const estado = document.getElementById("estado").value;

        if (nombre === "") {
          alert("Ingresa el nombre de la marca.");
          campoNombre.focus();
          return;
        }

        const fila = listaMarcas.insertRow();

        fila.insertCell().textContent = numeroMarca;
        fila.insertCell().textContent = nombre;
        fila.insertCell().textContent = descripcion;
        fila.insertCell().textContent = estado;

        numeroMarca++;
        formulario.reset();
        campoNombre.focus();
      });
    </script>
  </body>
</html>
